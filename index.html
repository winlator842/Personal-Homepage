<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .tagline {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 12px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
        .section p, .section li {
            color: #555;
            line-height: 1.7;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: #f0f0f5;
            color: #667eea;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 14px;
        }
        .links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .links a {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
        }
        .links a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">👋</div>
        <h1>小红书@SYSTEM-WIN11-JOEEY</h1>
        <p class="tagline">一个来自神秘的东方大国，我是入</p>

        <div class="section">
            <h2>🙋 关于我</h2>
            <p>男，爱好:Python   FNF   虚拟机    在小红书活跃。</p>
        </div>

        <div class="section">
            <h2>🎯 兴趣爱好</h2>
            <div class="tags">
                <span class="tag">编程</span>
                <span class="tag">游戏</span>
            </div>
        </div>

        <div class="section">
            <h2>🔗 联系我</h2>
            <div class="links">
                <a href="mailto:your@email.com">📧wananyouxi1@outlook.com</a>
                <a href="#">📱其他联系方式:无</a>
            </div>
        </div>
    </div>
</body>
</html>
